<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
  <title>프로젝트 한눈에: 클라이언트가 Mini DBMS에 SQL을 보내고, Mini DBMS는 SELECT 결과를 Mini Redis에 캐시한다. 각 서버는 자기 디스크 파일에 저장한다</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#8E9096" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="380" fill="#FFFFFF"/>
  <rect x="16" y="16" width="1248" height="348" rx="24" fill="#ffffff" stroke="#CDCED1" stroke-width="2"/>

  <rect x="56" y="70" width="200" height="110" rx="16" fill="#F1F2F4"/>
  <text x="156" y="133" text-anchor="middle" font-size="24" font-weight="700" fill="#2A2A2A">클라이언트</text>

  <line x1="258" y1="125" x2="402" y2="125" stroke="#8E9096" stroke-width="2" marker-end="url(#a)"/>
  <text x="330" y="110" text-anchor="middle" font-size="16" fill="#55575C">POST /query</text>
  <text x="330" y="148" text-anchor="middle" font-size="15" fill="#8E9096">SQL 한 문장</text>

  <rect x="406" y="60" width="300" height="130" rx="16" fill="#DCE5F8"/>
  <text x="556" y="116" text-anchor="middle" font-size="28" font-weight="700" fill="#4B77D8">Mini DBMS</text>
  <text x="556" y="152" text-anchor="middle" font-size="17" fill="#4B77D8">SQL · B+ 트리 · WAL</text>

  <line x1="708" y1="125" x2="922" y2="125" stroke="#8E9096" stroke-width="2" marker-end="url(#a)"/>
  <text x="815" y="110" text-anchor="middle" font-size="16" fill="#55575C">SELECT 결과 캐시</text>
  <text x="815" y="148" text-anchor="middle" font-size="15" fill="#8E9096">GET · PUT /keys</text>

  <rect x="926" y="60" width="300" height="130" rx="16" fill="#CDCED1"/>
  <text x="1076" y="116" text-anchor="middle" font-size="28" font-weight="700" fill="#2A2A2A">Mini Redis</text>
  <text x="1076" y="152" text-anchor="middle" font-size="17" fill="#2A2A2A">해시 테이블 · TTL · AOF</text>

  <line x1="556" y1="192" x2="556" y2="236" stroke="#8E9096" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1076" y1="192" x2="1076" y2="236" stroke="#8E9096" stroke-width="2" marker-end="url(#a)"/>

  <rect x="446" y="240" width="220" height="70" rx="14" fill="none" stroke="#CDCED1" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="556" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#2A2A2A">테이블.db + .wal</text>
  <rect x="966" y="240" width="220" height="70" rx="14" fill="none" stroke="#CDCED1" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1076" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#2A2A2A">AOF · RDB</text>
</svg>
