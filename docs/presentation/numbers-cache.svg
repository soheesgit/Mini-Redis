<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="328" viewBox="0 0 1280 328" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
<title>캐시 응답 시간 58.5 ms → 2.24 ms (26배), 캐시 처리량 845 req/s → 21,558 req/s (25배), 원본 호출 횟수 200번 → 1번 (1/200)</title>
<rect width="1280" height="328" fill="#FFFFFF"/>
<rect x="16" y="16" width="1248" height="296" rx="24" fill="#ffffff" stroke="#CDCED1" stroke-width="2"/>
<text x="56" y="78" font-size="20" font-weight="700" fill="#2A2A2A">캐시 응답 시간</text>
