<text x="458.0" y="271" font-size="17" font-weight="700" fill="#4B77D8">1번</text>
<rect x="1074" y="226" width="150" height="50" rx="12" fill="#DCE5F8"/>
<text x="1149" y="259" text-anchor="middle" font-size="24" font-weight="700" fill="#4B77D8">1/200</text>
