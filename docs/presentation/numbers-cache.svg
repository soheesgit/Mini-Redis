<text x="468.0" y="103" font-size="17" font-weight="700" fill="#4B77D8">2.24 ms</text>
<rect x="1074" y="58" width="150" height="50" rx="12" fill="#DCE5F8"/>
<text x="1149" y="91" text-anchor="middle" font-size="24" font-weight="700" fill="#4B77D8">26배</text>
<line x1="56" y1="124" x2="1224" y2="124" stroke="#E6E7EA" stroke-width="2"/>
<text x="56" y="162" font-size="20" font-weight="700" fill="#2A2A2A">캐시 처리량</text>
<text x="56" y="188" font-size="14" fill="#8E9096">많을수록 좋음</text>
<text x="428" y="156" text-anchor="end" font-size="14" font-weight="700" fill="#2A2A2A">없음</text>
<rect x="440" y="140" width="18.4" height="22" rx="6" fill="#CDCED1"/>
<text x="468.4" y="157" font-size="17" font-weight="700" fill="#2A2A2A">845 req/s</text>
<text x="428" y="186" text-anchor="end" font-size="14" font-weight="700" fill="#4B77D8">HIT</text>
