<text x="920.0" y="187" font-size="17" font-weight="700" fill="#4B77D8">21,558 req/s</text>
<rect x="1074" y="142" width="150" height="50" rx="12" fill="#DCE5F8"/>
<text x="1149" y="175" text-anchor="middle" font-size="24" font-weight="700" fill="#4B77D8">25배</text>
<line x1="56" y1="208" x2="1224" y2="208" stroke="#E6E7EA" stroke-width="2"/>
<text x="56" y="246" font-size="20" font-weight="700" fill="#2A2A2A">원본 호출 횟수</text>
<text x="56" y="272" font-size="14" fill="#8E9096">같은 키 동시 200건 · single-flight</text>
