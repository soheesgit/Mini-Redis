<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
  <title>순위를 읽을 때 Redis를 먼저 본다. HIT면 바로 응답하고, MISS면 DBMS에서 SELECT한 뒤 Redis에 60초 저장한다</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="360" fill="#f5f4ef"/>
  <rect x="16" y="16" width="1248" height="328" rx="24" fill="#ffffff" stroke="#e2e0da" stroke-width="2"/>

  <rect x="56" y="140" width="180" height="90" rx="16" fill="#f5f4ef"/>
  <text x="146" y="192" text-anchor="middle" font-size="22" font-weight="700" fill="#222">Node 서버</text>
  <line x1="238" y1="185" x2="312" y2="185" stroke="#8a8780" stroke-width="2" marker-end="url(#a)"/>

  <rect x="316" y="140" width="220" height="90" rx="16" fill="#f9e8e1"/>
  <text x="426" y="178" text-anchor="middle" font-size="22" font-weight="700" fill="#b84a35">Redis GET</text>
  <text x="426" y="207" text-anchor="middle" font-size="16" fill="#b84a35">lunch:ranking</text>

  <path d="M538 165 H590 V100 H952" fill="none" stroke="#1a6b52" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="770" y="88" text-anchor="middle" font-size="18" font-weight="700" fill="#1a6b52">HIT</text>
  <path d="M538 205 H590 V265 H656" fill="none" stroke="#b84a35" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
  <text x="623" y="253" text-anchor="middle" font-size="16" font-weight="700" fill="#b84a35">MISS</text>

  <rect x="956" y="55" width="270" height="90" rx="16" fill="#e1f0e6"/>
  <text x="1091" y="93" text-anchor="middle" font-size="22" font-weight="700" fill="#1a6b52">바로 응답</text>
  <text x="1091" y="122" text-anchor="middle" font-size="16" fill="#1a6b52">DBMS를 거치지 않음</text>

  <rect x="660" y="220" width="220" height="90" rx="16" fill="#e6eef8"/>
  <text x="770" y="258" text-anchor="middle" font-size="22" font-weight="700" fill="#3a5a8c">DBMS SELECT</text>
  <text x="770" y="287" text-anchor="middle" font-size="16" fill="#3a5a8c">새 순위 읽기</text>
  <line x1="882" y1="265" x2="952" y2="265" stroke="#8a8780" stroke-width="2" marker-end="url(#a)"/>

  <rect x="956" y="220" width="270" height="90" rx="16" fill="#f9e8e1"/>
  <text x="1091" y="258" text-anchor="middle" font-size="22" font-weight="700" fill="#b84a35">Redis PUT</text>
  <text x="1091" y="287" text-anchor="middle" font-size="16" fill="#b84a35">60초 저장 후 응답</text>
</svg>
