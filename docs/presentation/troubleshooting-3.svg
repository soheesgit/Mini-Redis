<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
<title>DBMS 트러블슈팅: 큰 결과 캐시. 증상 캐시 전체 꺼짐, 해결 큰 결과만 건너뜀, 결과 캐시 유지</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#8E9096" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1280" height="300" fill="#FFFFFF"/>
<rect x="16" y="16" width="1248" height="268" rx="24" fill="#ffffff" stroke="#CDCED1" stroke-width="2"/>
<rect x="56" y="80" width="150" height="120" rx="16" fill="#DCE5F8"/>
<text x="131" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#4B77D8">DBMS</text>
<text x="131" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#4B77D8">큰 결과 캐시</text>
<text x="386" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#8E9096">증상</text>
<rect x="236" y="80" width="300" height="120" rx="14" fill="#E6E7EA"/>
<text x="386" y="138" text-anchor="middle" font-size="30" font-weight="700" fill="#2A2A2A">캐시 전체 꺼짐</text>
<text x="386" y="172" text-anchor="middle" font-size="16" fill="#2A2A2A">1MB 넘는 결과 하나 때문에</text>
<text x="726" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#8E9096">해결</text>
<rect x="576" y="80" width="300" height="120" rx="14" fill="#F1F2F4"/>
<text x="726" y="138" text-anchor="middle" font-size="30" font-weight="700" fill="#2A2A2A">큰 결과만 건너뜀</text>
<text x="726" y="172" text-anchor="middle" font-size="16" fill="#2A2A2A">1MiB 초과는 저장 안 함</text>
<text x="1066" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#8E9096">결과</text>
<rect x="916" y="80" width="300" height="120" rx="14" fill="#DCE5F8"/>
<text x="1066" y="138" text-anchor="middle" font-size="36" font-weight="700" fill="#4B77D8">캐시 유지</text>
<text x="1066" y="172" text-anchor="middle" font-size="16" fill="#4B77D8">다른 쿼리는 계속 캐시 사용</text>
<line x1="538" y1="140" x2="572" y2="140" stroke="#8E9096" stroke-width="2" marker-end="url(#a)"/>
<line x1="878" y1="140" x2="912" y2="140" stroke="#8E9096" stroke-width="2" marker-end="url(#a)"/>
<text x="640" y="246" text-anchor="middle" font-size="16" fill="#8E9096">원인 · Redis가 1MB 넘는 값을 413으로 거절 → DBMS가 캐시 장애로 판단</text>
</svg>
