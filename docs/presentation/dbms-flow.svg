<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
  <title>Mini DBMS SQL 한 문장의 흐름: SQL 워커 8개 → Parser → 테이블 락 → SELECT는 여럿 동시에 B+ 트리나 스캔으로, 쓰기는 혼자 WAL 먼저</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#8E9096" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="400" fill="#FFFFFF"/>
  <rect x="16" y="16" width="1248" height="368" rx="24" fill="#ffffff" stroke="#CDCED1" stroke-width="2"/>

  <rect x="56" y="160" width="180" height="80" rx="16" fill="#F1F2F4"/>
  <text x="146" y="207" text-anchor="middle" font-size="21" font-weight="700" fill="#2A2A2A">SQL 워커 8개</text>
  <line x1="238" y1="200" x2="282" y2="200" stroke="#8E9096" stroke-width="2" marker-end="url(#a)"/>

  <rect x="286" y="160" width="160" height="80" rx="16" fill="#F1F2F4"/>
  <text x="366" y="207" text-anchor="middle" font-size="21" font-weight="700" fill="#2A2A2A">Parser</text>
  <line x1="448" y1="200" x2="492" y2="200" stroke="#8E9096" stroke-width="2" marker-end="url(#a)"/>

  <rect x="496" y="160" width="170" height="80" rx="16" fill="#DCE5F8"/>
  <text x="581" y="207" text-anchor="middle" font-size="21" font-weight="700" fill="#4B77D8">테이블 락</text>

  <path d="M668 185 H700 V100 H742" fill="none" stroke="#8E9096" stroke-width="2" marker-end="url(#a)"/>
  <path d="M668 215 H700 V300 H742" fill="none" stroke="#8E9096" stroke-width="2" marker-end="url(#a)"/>

  <rect x="746" y="60" width="200" height="80" rx="16" fill="#DCE5F8"/>
  <text x="846" y="95" text-anchor="middle" font-size="21" font-weight="700" fill="#4B77D8">SELECT</text>
  <text x="846" y="123" text-anchor="middle" font-size="17" fill="#4B77D8">여럿 동시</text>

  <path d="M948 85 H970 V70 H992" fill="none" stroke="#8E9096" stroke-width="2" marker-end="url(#a)"/>
  <path d="M948 115 H970 V130 H992" fill="none" stroke="#8E9096" stroke-width="2" marker-end="url(#a)"/>
  <rect x="996" y="44" width="230" height="52" rx="12" fill="#F1F2F4"/>
  <text x="1111" y="77" text-anchor="middle" font-size="18" font-weight="700" fill="#2A2A2A">id 조건 → B+ 트리</text>
  <rect x="996" y="104" width="230" height="52" rx="12" fill="#F1F2F4"/>
  <text x="1111" y="137" text-anchor="middle" font-size="18" font-weight="700" fill="#2A2A2A">그 외 → 전체 스캔</text>

  <rect x="746" y="260" width="200" height="80" rx="16" fill="#CDCED1"/>
  <text x="846" y="295" text-anchor="middle" font-size="21" font-weight="700" fill="#2A2A2A">쓰기</text>
  <text x="846" y="323" text-anchor="middle" font-size="17" fill="#2A2A2A">혼자</text>
  <line x1="948" y1="300" x2="992" y2="300" stroke="#8E9096" stroke-width="2" marker-end="url(#a)"/>

  <rect x="996" y="255" width="230" height="90" rx="14" fill="none" stroke="#CDCED1" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1111" y="291" text-anchor="middle" font-size="19" font-weight="700" fill="#2A2A2A">① WAL 먼저</text>
  <text x="1111" y="322" text-anchor="middle" font-size="19" font-weight="700" fill="#2A2A2A">② 8KB 페이지</text>
</svg>
