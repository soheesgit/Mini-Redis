<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
  <title>동시 실행: A 쓰기가 멈춘 동안 B 요청은 먼저 응답했다. A 조회는 커밋까지 기다린 뒤 새 값 20을 반환했다</title>
  <rect width="1280" height="330" fill="#FFFFFF"/>
  <rect x="16" y="16" width="1248" height="298" rx="24" fill="#ffffff" stroke="#CDCED1" stroke-width="2"/>

  <line x1="502" y1="70" x2="502" y2="284" stroke="#CDCED1" stroke-width="2"/>
  <line x1="865" y1="70" x2="865" y2="284" stroke="#CDCED1" stroke-width="2"/>
  <text x="502" y="56" text-anchor="middle" font-size="18" font-weight="700" fill="#55575C">A 쓰기 일시 정지</text>
  <text x="865" y="56" text-anchor="middle" font-size="18" font-weight="700" fill="#4B77D8">A 커밋</text>

  <g stroke="#E6E7EA" stroke-width="2">
    <line x1="328" y1="110" x2="1208" y2="110"/>
    <line x1="328" y1="178" x2="1208" y2="178"/>
    <line x1="328" y1="246" x2="1208" y2="246"/>
  </g>

  <text x="62" y="117" font-size="22" font-weight="700" fill="#2A2A2A">A 쓰기</text>
  <rect x="328" y="90" width="174" height="40" rx="10" fill="#CDCED1"/>
  <text x="415" y="117" text-anchor="middle" font-size="18" font-weight="700" fill="#2A2A2A">UPDATE</text>
  <line x1="502" y1="110" x2="858" y2="110" stroke="#8E9096" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="865" cy="110" r="7" fill="#4B77D8"/>

  <text x="62" y="185" font-size="22" font-weight="700" fill="#2A2A2A">B 요청</text>
  <rect x="550" y="158" width="268" height="40" rx="10" fill="#4B77D8"/>
  <text x="684" y="185" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">응답 완료</text>

  <text x="62" y="253" font-size="22" font-weight="700" fill="#2A2A2A">A 조회</text>
  <rect x="550" y="226" width="308" height="40" rx="10" fill="#F1F2F4"/>
  <text x="704" y="253" text-anchor="middle" font-size="18" font-weight="700" fill="#55575C">대기</text>
  <rect x="875" y="226" width="234" height="40" rx="10" fill="#DCE5F8"/>
  <text x="992" y="253" text-anchor="middle" font-size="18" font-weight="700" fill="#4B77D8">새 값 20 반환</text>
</svg>
