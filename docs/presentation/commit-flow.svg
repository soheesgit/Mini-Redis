<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
  <title>DBMS 커밋 흐름: 문장 하나가 바꿀 페이지를 메모리에 모으고, WAL 레코드 하나로 기록한 뒤 페이지에 반영하고 인덱스를 갱신한다. 크래시가 나면 재시작할 때 WAL을 다시 적용한다</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="360" fill="#FFFFFF"/>
  <rect x="16" y="16" width="1248" height="328" rx="24" fill="#ffffff" stroke="#CDCED1" stroke-width="2"/>

  <rect x="56" y="70" width="190" height="100" rx="16" fill="#F1F2F4"/>
  <text x="151" y="113" text-anchor="middle" font-size="21" font-weight="700" fill="#2A2A2A">문장 하나</text>
  <text x="151" y="143" text-anchor="middle" font-size="16" fill="#55575C">UPDATE · INSERT …</text>
  <line x1="248" y1="120" x2="282" y2="120" stroke="#8E9096" stroke-width="2" marker-end="url(#a)"/>

  <rect x="286" y="70" width="220" height="100" rx="16" fill="#F1F2F4"/>
  <text x="396" y="113" text-anchor="middle" font-size="21" font-weight="700" fill="#2A2A2A">바뀐 페이지</text>
  <text x="396" y="143" text-anchor="middle" font-size="16" fill="#55575C">메모리에만 모음</text>
  <line x1="508" y1="120" x2="542" y2="120" stroke="#8E9096" stroke-width="2" marker-end="url(#a)"/>

  <rect x="546" y="70" width="220" height="100" rx="16" fill="#DCE5F8"/>
  <text x="656" y="113" text-anchor="middle" font-size="21" font-weight="700" fill="#4B77D8">① WAL 레코드 1개</text>
  <text x="656" y="143" text-anchor="middle" font-size="16" fill="#4B77D8">페이지 통째 기록</text>
  <line x1="768" y1="120" x2="802" y2="120" stroke="#8E9096" stroke-width="2" marker-end="url(#a)"/>

  <rect x="806" y="70" width="190" height="100" rx="16" fill="#DCE5F8"/>
  <text x="901" y="113" text-anchor="middle" font-size="21" font-weight="700" fill="#4B77D8">② 페이지 반영</text>
  <text x="901" y="143" text-anchor="middle" font-size="16" fill="#4B77D8">.db 파일</text>
  <line x1="998" y1="120" x2="1032" y2="120" stroke="#8E9096" stroke-width="2" marker-end="url(#a)"/>

  <rect x="1036" y="70" width="190" height="100" rx="16" fill="#DCE5F8"/>
  <text x="1131" y="113" text-anchor="middle" font-size="21" font-weight="700" fill="#4B77D8">③ 인덱스 갱신</text>
  <text x="1131" y="143" text-anchor="middle" font-size="16" fill="#4B77D8">커밋 성공 뒤에만</text>

  <rect x="806" y="230" width="420" height="80" rx="16" fill="#CDCED1"/>
  <text x="1016" y="264" text-anchor="middle" font-size="20" font-weight="700" fill="#2A2A2A">②에서 죽으면 → 재시작 때 ①을 다시 적용</text>
  <text x="1016" y="292" text-anchor="middle" font-size="16" fill="#2A2A2A">문장 단위로 전부 아니면 없음</text>
  <path d="M901 172 V226" fill="none" stroke="#2A2A2A" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>

  <text x="396" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#55575C">확인: 자식 JVM을 UPDATE 도중 강제 종료</text>
  <text x="396" y="290" text-anchor="middle" font-size="16" fill="#8E9096">→ 다시 열어 문장 단위로 복구됐는지 검사</text>
</svg>
