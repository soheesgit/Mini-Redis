<text x="920.0" y="325" font-size="17" font-weight="700" fill="#b84a35">73.6 ms</text>
<text x="428" y="354" text-anchor="end" font-size="14" font-weight="700" fill="#1a6b52">B+</text>
<rect x="440" y="338" width="8.0" height="22" rx="6" fill="#1a6b52"/>
<text x="458.0" y="355" font-size="17" font-weight="700" fill="#1a6b52">0.09 ms</text>
<rect x="1074" y="310" width="150" height="50" rx="12" fill="#e1f0e6"/>
<text x="1149" y="343" text-anchor="middle" font-size="24" font-weight="700" fill="#1a6b52">800배</text>
<line x1="56" y1="376" x2="1224" y2="376" stroke="#eeece6" stroke-width="2"/>
<text x="56" y="414" font-size="20" font-weight="700" fill="#222222">LIMIT 20 조회</text>
<text x="56" y="440" font-size="14" fill="#8a8780">조기 종료 · 페이지 4,944개 → 1개</text>
<text x="428" y="408" text-anchor="end" font-size="14" font-weight="700" fill="#b84a35">전</text>
<rect x="440" y="392" width="470.0" height="22" rx="6" fill="#b84a35"/>
<text x="920.0" y="409" font-size="17" font-weight="700" fill="#b84a35">129 ms</text>
<text x="428" y="438" text-anchor="end" font-size="14" font-weight="700" fill="#1a6b52">후</text>
<rect x="440" y="422" width="8.0" height="22" rx="6" fill="#1a6b52"/>
<text x="458.0" y="439" font-size="17" font-weight="700" fill="#1a6b52">0.17 ms</text>
<rect x="1074" y="394" width="150" height="50" rx="12" fill="#e1f0e6"/>
<text x="1149" y="427" text-anchor="middle" font-size="24" font-weight="700" fill="#1a6b52">760배</text>
<line x1="56" y1="460" x2="1224" y2="460" stroke="#eeece6" stroke-width="2"/>
<text x="56" y="498" font-size="20" font-weight="700" fill="#222222">100만 행 삽입</text>
<text x="56" y="524" font-size="14" fill="#8a8780">fsync on → off · 정전 시 최근 커밋 유실</text>
<text x="428" y="492" text-anchor="end" font-size="14" font-weight="700" fill="#b84a35">on</text>
<rect x="440" y="476" width="470.0" height="22" rx="6" fill="#b84a35"/>
<text x="920.0" y="493" font-size="17" font-weight="700" fill="#b84a35">6.3 s</text>
<text x="428" y="522" text-anchor="end" font-size="14" font-weight="700" fill="#1a6b52">off</text>
<rect x="440" y="506" width="65.3" height="22" rx="6" fill="#1a6b52"/>
<text x="515.3" y="523" font-size="17" font-weight="700" fill="#1a6b52">0.88 s</text>
<rect x="1074" y="478" width="150" height="50" rx="12" fill="#e1f0e6"/>
<text x="1149" y="511" text-anchor="middle" font-size="24" font-weight="700" fill="#1a6b52">7배</text>
</svg>
