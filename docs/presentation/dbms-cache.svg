<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
  <title>DBMS의 SELECT 캐시: 테이블 내용 해시와 쿼리로 키를 만들어 Redis에서 찾는다. HIT면 바로 반환하고, MISS면 실행한 뒤 60초 저장한다. 데이터가 바뀌면 키도 바뀐다</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="400" fill="#f5f4ef"/>
  <rect x="16" y="16" width="1248" height="368" rx="24" fill="#ffffff" stroke="#e2e0da" stroke-width="2"/>

  <rect x="56" y="150" width="170" height="90" rx="16" fill="#f5f4ef"/>
  <text x="141" y="202" text-anchor="middle" font-size="22" font-weight="700" fill="#222">SELECT</text>
  <line x1="228" y1="195" x2="262" y2="195" stroke="#8a8780" stroke-width="2" marker-end="url(#a)"/>

  <rect x="266" y="150" width="250" height="90" rx="16" fill="#e6eef8"/>
  <text x="391" y="188" text-anchor="middle" font-size="22" font-weight="700" fill="#3a5a8c">캐시 키</text>
  <text x="391" y="217" text-anchor="middle" font-size="16" fill="#3a5a8c">테이블 내용 해시 + 쿼리</text>
  <line x1="518" y1="195" x2="552" y2="195" stroke="#8a8780" stroke-width="2" marker-end="url(#a)"/>

  <rect x="556" y="150" width="180" height="90" rx="16" fill="#f9e8e1"/>
  <text x="646" y="202" text-anchor="middle" font-size="22" font-weight="700" fill="#b84a35">Redis GET</text>

  <path d="M738 175 H770 V105 H952" fill="none" stroke="#1a6b52" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="860" y="93" text-anchor="middle" font-size="18" font-weight="700" fill="#1a6b52">HIT</text>
  <path d="M738 215 H770 V285 H792" fill="none" stroke="#b84a35" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
  <text x="762" y="262" text-anchor="end" font-size="16" font-weight="700" fill="#b84a35">MISS</text>

  <rect x="956" y="60" width="270" height="90" rx="16" fill="#e1f0e6"/>
  <text x="1091" y="98" text-anchor="middle" font-size="22" font-weight="700" fill="#1a6b52">바로 반환</text>
  <text x="1091" y="127" text-anchor="middle" font-size="16" fill="#1a6b52">조건 계산 · 정렬 생략</text>

  <rect x="796" y="240" width="170" height="90" rx="16" fill="#e6eef8"/>
  <text x="881" y="292" text-anchor="middle" font-size="22" font-weight="700" fill="#3a5a8c">실행</text>
  <line x1="968" y1="285" x2="1002" y2="285" stroke="#8a8780" stroke-width="2" marker-end="url(#a)"/>

  <rect x="1006" y="240" width="220" height="90" rx="16" fill="#f9e8e1"/>
  <text x="1116" y="278" text-anchor="middle" font-size="22" font-weight="700" fill="#b84a35">Redis PUT</text>
  <text x="1116" y="307" text-anchor="middle" font-size="16" fill="#b84a35">60초 저장</text>

  <text x="391" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#3a5a8c">데이터가 바뀌면 해시가 바뀜</text>
  <text x="391" y="326" text-anchor="middle" font-size="16" fill="#8a8780">→ 새 키라서 옛 결과를 안 씀</text>
</svg>
